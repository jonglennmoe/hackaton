spring.application.name=hildur
server.port=8080

# --- In-memory database (H2) -------------------------------------------------
# "mem:" means the data lives in RAM only. Restart the app and it starts fresh
# from the seed data in DataSeeder.
spring.datasource.url=jdbc:h2:mem:hildur;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates the tables from the @Entity classes.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Browse the tables at http://localhost:8080/h2-console (JDBC URL above, user "sa").
spring.h2.console.enabled=true

# --- Hildur ------------------------------------------------------------------
hildur.time-zone=Europe/Stockholm
hildur.wifi-network=Hildur-Gast
hildur.wifi-password=Norrsken-Kjell-12
hildur.on-duty-staff=lisa.b
hildur.auto-assign-delay=6s
hildur.session-ttl=12h
hildur.allowed-origins=http://localhost:5173
